name: Build SOVEREIGN-TERMINAL APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'sovereign-terminal*.zip'
      - '.github/workflows/build-sovereign-terminal.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Cari & extract zip sovereign-terminal (nama boleh beda-beda versi)
        run: |
          set -e
          ZIP_FILE=$(ls sovereign-terminal*.zip 2>/dev/null | sort -V | tail -n 1)
          if [ -n "$ZIP_FILE" ]; then
            echo "Ditemukan: $ZIP_FILE — mengekstrak..."
            mkdir -p extracted
            unzip -o "$ZIP_FILE" -d extracted
          elif [ -f "index.html" ]; then
            echo "Tidak ada file sovereign-terminal*.zip, tapi index.html sudah ada langsung di root repo — dipakai langsung."
            mkdir -p extracted
            cp index.html manifest.json sw.js icon-192.png icon-512.png extracted/ 2>/dev/null || true
          else
            echo "::error::Tidak ditemukan file sovereign-terminal*.zip maupun index.html di root repo."
            echo "File di root repo saat ini:"
            ls -la
            exit 1
          fi

      - name: Validasi isi hasil extract
        run: |
          if [ ! -f "extracted/index.html" ]; then
            echo "::error::extracted/index.html tidak ditemukan setelah extract. Cek isi zip — index.html harus ada di root zip (bukan di dalam subfolder)."
            exit 1
          fi
          echo "OK — index.html ditemukan."
          ls -la extracted

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Init npm project
        run: npm init -y

      - name: Install Capacitor
        run: npm install @capacitor/core @capacitor/cli @capacitor/android

      - name: Siapkan folder web (www) dari hasil extract
        run: |
          mkdir -p www
          cp -r extracted/* www/
          ls -la www

      - name: Init Capacitor
        run: npx cap init "SOVEREIGN" "id.sovereign.terminal" --web-dir=www

      - name: Tambah platform Android
        run: npx cap add android

      - name: Generate icon launcher Android dari assets/icon.png (fix icon default Capacitor)
        run: |
          mkdir -p assets
          if [ -f "extracted/assets/icon.png" ]; then
            cp extracted/assets/icon.png assets/icon.png
          elif [ -f "extracted/icon-512.png" ]; then
            echo "assets/icon.png tidak ada di zip, fallback ke icon-512.png (di-upscale)."
            convert extracted/icon-512.png -resize 1024x1024 assets/icon.png
          else
            echo "::warning::Tidak ada source icon ditemukan — icon Android akan tetap default Capacitor."
          fi
          if [ -f "assets/icon.png" ]; then
            npm install @capacitor/assets --save-dev
            npx capacitor-assets generate --android
          fi

      - name: Pastikan Gradle & AGP kompatibel dengan JDK 21
        working-directory: android
        run: |
          echo "--- gradle-wrapper.properties SEBELUM ---"
          cat gradle/wrapper/gradle-wrapper.properties
          sed -i 's#distributionUrl=.*#distributionUrl=https\\://services.gradle.org/distributions/gradle-8.11.1-all.zip#' gradle/wrapper/gradle-wrapper.properties
          echo "--- gradle-wrapper.properties SESUDAH ---"
          cat gradle/wrapper/gradle-wrapper.properties
          echo "--- build.gradle (root) SEBELUM ---"
          cat build.gradle
          sed -i -E "s#(classpath ['\"]com\.android\.tools\.build:gradle:)[0-9.]+(['\"])#\\18.7.2\\2#" build.gradle
          echo "--- build.gradle (root) SESUDAH sed AGP ---"
          cat build.gradle
          echo "--- Paksa konsistensi versi Kotlin stdlib (fix duplicate class) ---"
          {
            echo ''
            echo 'allprojects {'
            echo '    configurations.all {'
            echo '        resolutionStrategy {'
            echo "            force 'org.jetbrains.kotlin:kotlin-stdlib:1.9.24'"
            echo "            force 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.9.24'"
            echo "            force 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.9.24'"
            echo "            force 'org.jetbrains.kotlin:kotlin-stdlib-common:1.9.24'"
            echo '        }'
            echo '    }'
            echo '}'
          } >> build.gradle
          echo "--- build.gradle (root) FINAL ---"
          cat build.gradle

      - name: Sync Capacitor -> Android
        run: npx cap sync android

      - name: Build APK debug
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK sebagai artifact
        uses: actions/upload-artifact@v4
        with:
          name: SOVEREIGN-TERMINAL-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
